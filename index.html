                        )}

                        {showLumi && (
                            <LumiPanel
                                onClose={() => setShowLumi(false)}
                                currentUser={currentUser}
                                userRole={userRole}
                                homeworks={homeworks}
                                groupName={groups.find(g => g.id === selectedGroup)?.name || ''}
                            />
                        )}

                        {activeQuickChat === 'group' && selectedGroup && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
                                    <div className="flex justify-between items-center p-4 border-b">
                                        <h3 className="font-bold text-gray-900">Чат группы: {groups.find(g => g.id === selectedGroup)?.name || ''}</h3>
                                        <button
                                            onClick={() => setActiveQuickChat(null)}
                                            className="p-2 hover:bg-gray-100 rounded-lg"
                                        >
                                            <XIcon size={20} />
                                        </button>
                                    </div>
                                    <div className="p-4 overflow-y-auto">
                                        <ChatBox
                                            type="group"
                                            chatId={selectedGroup}
                                            title={`Чат группы: ${groups.find(g => g.id === selectedGroup)?.name || ''}`}
                                            currentUserName={currentUser.name}
                                            currentUserId={currentUser.id}
                                        />
                                    </div>
                                </div>
                            </div>
                        )}
                        <Footer />
                    </div>
                );
            }

            if (currentPage === 'student-dashboard' && currentUser) {
                const studentHomeworks = homeworks;
                
                return (
                    <div className="min-h-screen bg-gray-50 has-code-backdrop">
                        <CodeBackdrop />
                        <GreetingToast name={currentUser.name} />
                        <div className="bg-white shadow">
                            <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <AppLogo />
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900">MyHomework</h1>
                                        <p className="text-sm text-gray-500">Ученик: {currentUser.name} | Группа: {groups.find(g => g.id === currentUser.group)?.name || currentUser.group}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => setCurrentPage('student-profile')}
                                        className="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100"
                                    >
                                        <UserIcon size={20} />
                                        Профиль
                                    </button>
                                    <ThemeToggle theme={theme} setTheme={setTheme} />
                                    <button
                                        onClick={handleLogout}
                                        className="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100"
                                    >
                                        <LogOutIcon size={20} />
                                        Выход
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="max-w-6xl mx-auto px-6 py-8">
                            <NewsCarousel />

                            <div className="grid grid-cols-3 gap-4 mb-8">
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <div className="text-3xl font-bold text-blue-600">{studentHomeworks.length}</div>
                                    <p className="text-gray-600 mt-2">Всего заданий</p>
                                </div>
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <div className="text-3xl font-bold text-green-600">
                                        {mySubmissions.filter(s => s.status === 'done').length}
                                    </div>
                                    <p className="text-gray-600 mt-2">Сделано</p>
                                </div>
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <div className="text-3xl font-bold text-red-500">
                                        {studentHomeworks.length - mySubmissions.filter(s => s.status === 'done').length}
                                    </div>
                                    <p className="text-gray-600 mt-2">Осталось сделать</p>
                                </div>
                            </div>

                            <div className="mb-8">
                                <h2 className="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
                                    <UsersIcon size={22} />
                                    Участники группы
                                    <span className="text-sm font-normal text-gray-500">({students.length})</span>
                                </h2>
                                <div className="bg-white rounded-2xl shadow-lg p-4 flex flex-wrap gap-3">
                                    {students.map(member => (
                                        <div
                                            key={member.id}
                                            className="flex items-center gap-2 bg-gray-50 rounded-full pl-1 pr-3 py-1"
                                        >
                                            <div className="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 text-white flex items-center justify-center text-sm font-bold flex-shrink-0">
                                                {(member.name || '?').charAt(0).toUpperCase()}
                                            </div>
                                            <span className="text-sm font-medium text-gray-800">
                                                {member.name}
                                                {member.id === currentUser.id && ' (вы)'}
                                            </span>
                                            {member.id !== currentUser.id && (
                                                <button
                                                    onClick={() => setPeerChatStudent(member)}
                                                    className="ml-1 p-1.5 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 transition"
                                                    title={`Написать: ${member.name}`}
                                                >
                                                    <MessageSquareIcon size={14} />
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                    {students.length === 0 && (
                                        <p className="text-sm text-gray-400">Загружаем список участников...</p>
                                    )}
                                </div>
                            </div>

                            <div>
                                <h2 className="text-2xl font-bold text-gray-900 mb-6">Ваши задания</h2>
                                <div className="space-y-4">
                                    {studentHomeworks.map(hw => (
                                        <div key={hw.id} className="bg-white rounded-2xl shadow-lg p-6">
                                            <div className="flex justify-between items-start gap-2">
                                                <h3 className="text-lg font-bold text-gray-900">{hw.title}</h3>
                                                {hw.closed && (
                                                    <span className="flex items-center gap-1 px-3 py-1 bg-gray-200 text-gray-700 rounded-full text-xs font-semibold whitespace-nowrap">
                                                        <LockIcon size={12} />
                                                        Закрыто
                                                    </span>
                                                )}
                                            </div>
                                            <p className="text-gray-600 mt-2">{hw.description}</p>
                                            <div className="flex gap-2 mt-3 mb-4">
                                                <span className="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm">
                                                    {hw.subject}
                                                </span>
                                                <span className="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm flex items-center gap-1">
                                                    <ClockIcon size={14} />
                                                    {formatDueDate(hw.dueDate)}
                                                </span>
                                            </div>
                                            <StudentHomeworkSubmission
                                                homeworkId={hw.id}
                                                groupId={currentUser.group}
                                                studentId={currentUser.id}
                                                studentName={currentUser.name}
                                                closed={hw.closed}
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <button
                            onClick={() => setActiveQuickChat('group')}
                            className="chat-fab"
                            title="Чат группы"
                        >
                            <UsersIcon size={26} />
                        </button>
                        <button
                            onClick={() => setActiveQuickChat('private')}
                            className="chat-fab-secondary"
                            title="Чат с учителем"
                        >
                            <UserIcon size={22} />
                        </button>
                        <button
                            onClick={() => setShowLumi(true)}
                            className="ai-fab"
                            title="Lumi — ИИ-помощник"
                        >
                            <SparklesIcon size={22} />
                        </button>

                        {showLumi && (
                            <LumiPanel
                                onClose={() => setShowLumi(false)}
                                currentUser={currentUser}
                                userRole={userRole}
                                homeworks={studentHomeworks}
                                groupName={groups.find(g => g.id === currentUser.group)?.name || currentUser.group}
                            />
                        )}

                        {activeQuickChat && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
                                    <div className="flex justify-between items-center p-4 border-b">
                                        <h3 className="font-bold text-gray-900">
                                            {activeQuickChat === 'group'
                                                ? `Чат группы: ${groups.find(g => g.id === currentUser.group)?.name || currentUser.group}`
                                                : 'Личный чат с учителем'}
                                        </h3>
                                        <button
                                            onClick={() => setActiveQuickChat(null)}
                                            className="p-2 hover:bg-gray-100 rounded-lg"
                                        >
                                            <XIcon size={20} />
                                        </button>
                                    </div>
                                    <div className="p-4 overflow-y-auto">
                                        {activeQuickChat === 'group' ? (
                                            <ChatBox
                                                type="group"
                                                chatId={currentUser.group}
                                                title={`Чат группы: ${groups.find(g => g.id === currentUser.group)?.name || currentUser.group}`}
                                                currentUserName={currentUser.name}
                                                currentUserId={currentUser.id}
                                            />
                                        ) : (
                                            <ChatBox
                                                type="private"
                                                chatId={currentUser.id}
                                                title="Личный чат с учителем"
                                                currentUserName={currentUser.name}
                                                currentUserId={currentUser.id}
                                            />
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                        {peerChatStudent && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
                                    <div className="flex justify-between items-center p-4 border-b">
                                        <h3 className="font-bold text-gray-900">Чат: {peerChatStudent.name}</h3>
                                        <button
                                            onClick={() => setPeerChatStudent(null)}
                                            className="p-2 hover:bg-gray-100 rounded-lg"
                                        >
                                            <XIcon size={20} />
                                        </button>
                                    </div>
                                    <div className="p-4 overflow-y-auto">
                                        <ChatBox
                                            type="peer"
                                            chatId={getPeerChatId(currentUser.id, peerChatStudent.id)}
                                            title={`Чат с ${peerChatStudent.name}`}
                                            currentUserName={currentUser.name}
                                            currentUserId={currentUser.id}
                                        />
                                    </div>
                                </div>
                            </div>
                        )}
                        <Footer />
                    </div>
                );
            }

            if (currentPage === 'student-profile' && currentUser) {
                const total = homeworks.length;
                const done = mySubmissions.filter(s => s.status === 'done').length;
                const partial = mySubmissions.filter(s => s.status === 'partial').length;
                const groupName = groups.find(g => g.id === currentUser.group)?.name || currentUser.group;

                const handleAvatarSelect = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    try {
                        const storageRef = firebase.storage().ref();
                        const fileRef = storageRef.child(`avatars/${currentUser.id}_${Date.now()}`);
                        await fileRef.put(file);
                        const url = await fileRef.getDownloadURL();
                        await db.collection('users').doc(currentUser.id).update({ avatarUrl: url });
                        setCurrentUser(prev => ({ ...prev, avatarUrl: url }));
                    } catch (error) {
                        console.error('Ошибка загрузки аватара:', error);
                        alert('Не удалось загрузить фото профиля. Попробуйте ещё раз.');
                    }
                };

                return (
                    <div className="min-h-screen bg-gray-50">
                        <div className="max-w-3xl mx-auto px-6 py-8">
                            <div className="flex justify-between items-center mb-6">
                                <button
                                    onClick={() => setCurrentPage('student-dashboard')}
                                    className="flex items-center gap-2 text-gray-600 hover:text-gray-900"
                                >
                                    <ArrowLeftIcon size={18} />
                                    Назад в кабинет
                                </button>
                                <div className="flex items-center gap-2">
                                    <ThemeToggle theme={theme} setTheme={setTheme} />
                                    <button
                                        onClick={handleLogout}
                                        className="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100"
                                    >
                                        <LogOutIcon size={20} />
                                        Выход
                                    </button>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-xl overflow-hidden mb-6">
                                <div className="h-28 bg-gradient-to-r from-blue-500 to-purple-600"></div>
                                <div className="px-8 pb-8">
                                    <div className="-mt-12 mb-4">
                                        <label className="cursor-pointer relative inline-block" title="Изменить фото профиля">
                                            {currentUser.avatarUrl ? (
                                                <img src={currentUser.avatarUrl} className="avatar-circle" alt="Аватар" />
                                            ) : (
                                                <div className="avatar-circle">
                                                    {(currentUser.name || '?').charAt(0).toUpperCase()}
                                                </div>
                                            )}
                                            <span className="absolute bottom-0 right-0 bg-blue-500 text-white rounded-full p-1.5 border-2 border-white">
                                                <CameraIconOutline size={14} />
                                            </span>
                                            <input type="file" accept="image/*" onChange={handleAvatarSelect} className="hidden" />
                                        </label>
                                    </div>
                                    <h1 className="text-2xl font-bold text-gray-900">{currentUser.name}</h1>
                                    <p className="text-gray-500">{currentUser.email}</p>
                                    <p className="text-gray-600 mt-2">
                                        Группа: <span className="font-semibold text-gray-800">{groupName}</span>
                                    </p>
                                </div>
                            </div>

                            <h2 className="text-lg font-bold text-gray-900 mb-3">Моя статистика</h2>
                            <div className="grid grid-cols-3 gap-4">
                                <div className="bg-white rounded-2xl shadow-lg p-6 text-center">
                                    <div className="text-3xl font-bold text-blue-600">{total}</div>
                                    <p className="text-gray-600 mt-2 text-sm">Всего заданий</p>
                                </div>
                                <div className="bg-white rounded-2xl shadow-lg p-6 text-center">
                                    <div className="text-3xl font-bold text-green-600">{done}</div>
                                    <p className="text-gray-600 mt-2 text-sm">Сделано</p>
                                </div>
                                <div className="bg-white rounded-2xl shadow-lg p-6 text-center">
                                    <div className="text-3xl font-bold text-amber-500">{partial}</div>
                                    <p className="text-gray-600 mt-2 text-sm">Частично</p>
                                </div>
                            </div>
                        </div>
                        <Footer />
                    </div>
                );
            }

            return null;
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, info) {
                console.error('Ошибка приложения:', error, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6">
                            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 text-center">
                                <h1 className="text-xl font-bold text-gray-900 mb-2">Что-то пошло не так</h1>
                                <p className="text-gray-600 mb-4">
                                    Произошла ошибка при загрузке приложения. Попробуйте обновить страницу.
                                </p>
                                <p className="text-xs text-gray-400 break-words mb-4">
                                    {String(this.state.error && this.state.error.message)}
                                </p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="w-full py-2 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg font-semibold"
                                >
                                    Обновить страницу
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><HomeworkApp /></ErrorBoundary>);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
